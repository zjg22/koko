<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>商品管理 · 前后端联调练习</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      padding: 30px;
      background: #F8FAFC;
      color: #0F172A;
    }
    h3 { color: #2563EB; margin-bottom: 12px; }
    h4 { color: #0F172A; margin: 26px 0 10px 0; }
    input {
      padding: 7px 10px;
      font-size: 14px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      margin-right: 8px;
    }
    button {
      padding: 8px 18px;
      font-size: 15px;
      cursor: pointer;
      background: #2563EB;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    table {
      border-collapse: collapse;
      width: 720px;
      background: #fff;
      margin-top: 10px;
      box-shadow: 0 2px 10px rgba(15,23,42,0.06);
    }
    td, th { border: 1px solid #E2E8F0; padding: 7px 12px; text-align: left; }
    th { background: #F1F5F9; }
    #msg { margin-top: 12px; font-family: Consolas, monospace; color: #2563EB; font-weight: bold; }
  </style>
</head>
<body>
  <h3>商品列表</h3>

  <input type="text" id="search" placeholder="输入商品名称搜索" style="width:260px">

  <table>
    <thead>
      <tr>
        <th>id</th>
        <th>商品名</th>
        <th>价格</th>
        <th>库存</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <h4>新增商品</h4>
  <div>
    <input id="title" placeholder="商品名称">
    <input id="price" placeholder="价格" style="width:90px">
    <input id="stock" placeholder="库存" style="width:90px">
    <button id="addBtn">提交新增</button>
  </div>

  <div id="msg"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
